namaria.com/230/Vacation-Rentals"], ["City of Anna Maria FEMA / SFHA", "https://www.cityofannamaria.com/214/FEMA-Flood-Protection-Resources"], ["Local three-towns guide (character)", "https://amilifestyle.com/island-talk/three-towns-of-anna-maria-island"]]}, "Holmes Beach": {"text": "Mid-island practical center \u2014 Manatee Public Beach, daily shopping, and the SR 64 / Manatee Avenue bridge \u2014 and the deepest, most mixed under-$2M board. Short-term rental rules are zoning-specific: 30-day minimum stays in R-1 and R-1AA, weekly in R-2/R-3/R-4, daily in A-1, plus a $780 two-year Vacation Rental Certificate. Most of this board is flood zone AE (3 unique actives are VE). The free trolley runs Gulf Drive through town, including a stop at Manatee Public Beach.", "sources": [["Holmes Beach Vacation Rental Certificates", "https://holmesbeachfl.org/departments/vacation_rental_certificates.php"], ["MCAT Route 5 trolley", "https://www.mymanatee.org/services-and-amenities/service-listing/service-details/ride-route-5-anna-maria-island-trolley"], ["Local three-towns guide (character)", "https://amilifestyle.com/island-talk/three-towns-of-anna-maria-island"]]}, "Bradenton Beach": {"text": "Livelier south end around historic Bridge Street, Coquina Beach, and the Cortez Bridge, with under-$2M stock that is condo-heavy and the least expensive of the three. Rentals need a state DBPR license, a city Business Tax Receipt, and a city TPLE license; a September 2026 occupancy-rule amendment was proposed, but this watch has not confirmed a final adoption. The free trolley turns around at Coquina Beach. Three unique actives on this board are flood zone VE; a February 2025 AMI Sun report said the city's CRS discount had been flagged for post-storm compliance questions \u2014 verify the current class with the city and the insurer.", "sources": [["AMI Sun on proposed TPLE changes", "https://amisun.com/bradenton-beach-commission-amending-short-term-rental-rules/"], ["MCAT Route 5 trolley", ": [], "gone": []}}, "highlights": ["<b>Nov 25 refresh:<\/b> Newly under the cap: <a href='https://www.coldwellbankerhomes.com/fl/holmes-beach/145-50th-st/pid_74526517/' target='_blank' rel='noopener'>145 50th St<\/a>, Holmes Beach, cut $2,095,000 \u2192 $1,980,000 (SFR, 4bd/3.5ba, 2,040 sf, Flood AE, built 2008). New: <a href='https://www.coldwellbankerhomes.com/fl/bradenton-beach/117-7th-street-n-35/pid_74895410/' target='_blank' rel='noopener'>117 7th St N #35<\/a>, Bradenton Beach, $349,000 (condo, 1bd/1ba, 594 sf, Flood AE, built 1973). Price cuts: 3803 E Bay Dr #9 $650,000 \u2192 $625,000; 101 25th St N #1 $699,000 \u2192 $649,900. No new buy-relevant AMI news today.", "<b>Just listed:<\/b> <a href='https://www.coldwellbankerhomes.com/fl/anna-maria/706-n-shore-dr/pid_74748473/' target='_blank' rel='noopener'>706 N Shore Dr<\/a>, Anna Maria, $1,899,000, 3bd/2ba, 1,412 sf, listed Nov 13 \u2014 renovated north-end house near Pine Avenue and the beaches (Flood AE). Same week: condos at <a href='https://www.coldwellbankerhomes.com/fl/holmes-beach/3705-e-bay-dr-217/pid_74768505/' target='_blank' rel='noopener'>3705 E Bay Dr #217<\/a> ($429,900) and <a href='https://www.coldwellbankerhomes.com/fl/holmes-beach/6400-flotilla-dr-14/pid_74770322/' target='_blank' rel='noopener'>6400 Flotilla Dr #14<\/a> ($430,000), both listed Nov 14. Gulf-front condo: <a href='https://www.coldwellbankerhomes.com/fl/bradenton-beach/7000-gulf-dr-115/pid_74665206/' target='_blank' rel='noopener'>7000 Gulf Dr #115<\/a>, Bradenton Beach, $1,290,000, 2bd/2ba, listed Nov 8.", "<b>Inventory / prices:<\/b> On this under-$2M board, houses are about 5.0 months of inventory (neutral) and condos/townhomes about 8.9 months (buyer's), using closed sales from May 19\u2013Nov 13, 2026. A separate all-price snapshot from MaxLife Realty, also dated Nov 16 and drawn from Stellar MLS, puts the island at 60 active listings (their shown set is mostly single-family, $1.2M\u2013$8.3M), 77 sales in 12 months, median sold $2.2M, 9.4 months of inventory (buyer's), 93.5% sale-to-list, median 114 DOM. <a href='https://maxliferealty.com/market-reports/anna-maria-island' target='_blank' rel='noopener'>MaxLife AMI report<\/a>.", "<b>Flood insurance &amp; the 50% rule:<\/b> The City of Anna Maria says the entire city is in a Special Flood Hazard Area. After Hurricanes Helene (Sep 26, 2024) and Milton (Oct 9, 2024), the city sent substantial-damage assessment letters: if repair cost is 50% or more of the structure's pre-damage market value (land excluded), the building must be brought up to current floodplain and Florida Building Code standards, which usually means elevation or a rebuild. Confirm any target with that city's building department \u2014 each of the three cities makes its own determination. <a href='https://amisun.com/city-issues-substantial-damage-assessment-letters/' target='_blank' rel='noopener'>AMI Sun, Jan 8, 2025<\/a> \u00b7 <a href='https://www.cityofannamaria.com/214/FEMA-Flood-Protection-Resources' target='_blank' rel='noopener'>City of Anna Maria FEMA page<\/a>.", "<b>New-construction elevation:<\/b> A Feb 10, 2025 AMI Sun report on the city's CRS rating said Anna Maria requires the bottom of the first elevated level's support structure to be 12 feet above sea level, which is stricter than FEMA's minimum and helped the city move toward a Class 5 CRS discount (25% off NFIP premiums, then scheduled for Oct 1, 2025). Holmes Beach was described as heading the same way; Bradenton Beach was Class 6 and had been flagged for post-storm compliance questions. Those ratings are from early 2025 \u2014 verify the current class and premium with the insurer and the city before relying on the discount. <a href='https://amisun.com/improved-crs-rating-increasing-flood-insurance-discounts/' target='_blank' rel='noopener'>AMI Sun, Feb 10, 2025<\/a>.", "<b>Short-term rental rules differ by city:<\/b> Anna Maria requires city vacation-rental registration, inspection, and a state DBPR license; the 2026\u201327 fee is $100.20 per permitted occupant (Resolution R26-828; 720 registered rentals as of Feb 13, 2026). <a href='https://www.cityofannamaria.com/230/Vacation-Rentals' target='_blank' rel='noopener'>City of Anna Maria<\/a>. Holmes Beach requires a Vacation Rental Certificate ($780 initial and every two years); minimum stay is 30 days in R-1/R-1AA, 7 days in R-2/R-3/R-4, and daily in A-1. <a href='https://holmesbeachfl.org/departments/vacation_rental_certificates.php' target='_blank' rel='noopener'>Holmes Beach VRC page<\/a>. Bradenton Beach requires a DBPR license, a city Business Tax Receipt, and a city TPLE license; the commission considered a 2+2 occupancy cap in September 2026 \u2014 confirm whether that amendment was adopted before underwriting a rental. <a href='https://amisun.com/bradenton-beach-commission-amending-short-term-rental-rules/' target='_blank' rel='noopener'>AMI Sun on the proposed TPLE changes<\/a>. All three cities sit in Manatee County, so stays of six months or less also carry county tourist tax."], "log": [{"date": "2026-11-26", "text": "New 0, cuts 0, status changes 0, removed 0.\nAnna Maria: no changes\nHolmes Beach: no changes\nBradenton Beach: no changes", "by_town": {"Anna Maria": {"new": [], "cuts": [], "raises": [], "status": [], "gone": []}, "Holmes Beach": {"new": [], "cuts": [], "raises": [], "status": [], "gone": []}, "Bradenton Beach": {"new": [], "cuts": [], "raises": [], "status": [], "gone": []}}}, {"date": "2026-11-25", "text": "New 1, cuts 0, status changes 0, removed 0.\nAnna Maria: no changes\nHolmes Beach: New: 145 50th St ($1,980,000)\nBradenton Beach: no changes", "by_town": {"Anna Maria": {"new": [], "cuts": [], "raises": [], "status": [], "gone": []}, "Holmes Beach": {"new": [{"mls": "A4710094", "addr": "145 50th St", "price": 1980000, "status": "Active", "area": "Holmes Beach", "url": "https://www.coldwellbankerhomes.com/fl/holmes-beach/145-50th-st/pid_74526517/", "type": "Single Family"}   if(note) note.innerHTML=`Each dot is an active ≤$2M listing in this town with heated sq ft: <span style="color:#5b8cff">●</span> house <span style="color:#f5b942">●</span> condo/TH <span style="color:#3ccf8e">●</span> multi-family <span style="color:#9aa0bd">●</span> co-op/manufactured. Pending and standalone boat slips are excluded. Tap a dot for details.`;
}

$('#jump').innerHTML=REGS.map(r=>`<a href="#reg-${r.id}" data-r="${r.id}">${esc(r.label||r.city)} · ${r.active_unique}</a>`).join('');
$('#regions').innerHTML=REGS.map(r=>{
  const ch=(T.character||{})[r.city]||{};
  const src=(ch.sources||[]).map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ');
  const rec=(r.recent||[]).map(s=>`${esc(s.sold_date)} · ${esc(s.addr)} · ${esc(s.type||'')} · <b>${money(s.sold_price)}</b>${s.dom!=null?' · '+s.dom+' DOM':''}${s.url?' · <a href="'+esc(s.url)+'" target="_blank" rel="noopener">source</a>':''}`).join('<br>');
  const badge=r.moi_all&&r.moi_all.label?`<span class="rate ${rc(r.moi_all.label)}">${r.moi_all.label.toLowerCase()} market</span>`:'';
  const actlab=r.active_listings&&r.active_listings!==r.active_unique?`${r.active_unique} unique <span class="ls">(${r.active_listings} MLS)</span>`:String(r.active_unique);
  return `<section class="region" id="reg-${r.id}">
    <div class="rhead">
      <div class="kicker">${esc(r.mix||'')}</div>
      <h2>${esc(r.label||r.city)} ${badge}</h2>
      <div class="sub">Median list ${money(r.list_median)} · range ${money(r.list_min)}–${money(r.list_max)}</div>
    </div>
    <div class="rstats">
      <div class="card"><div class="l">Active ≤$2M</div><div class="v">${actlab}</div><div class="d">${esc(r.mix||'')}</div></div>
      <div class="card"><div class="l">Median list</div><div class="v">${money(r.list_median)}</div><div class="d">${money(r.list_min)}–${money(r.list_max)}</div></div>
      <div class="card"><div class="l">Median list $/sf</div><div class="v">${r.ppsf_median==null?'—':'$'+Math.round(r.ppsf_median).toLocaleString()}</div><div class="d">${r.ppsf_n?('n='+r.ppsf_n+' with sf'):'Unavailable'}</div></div>
      <div class="card"><div class="l">Pending</div><div class="v">${r.pending??'—'}</div><div class="d">under contract, not in actives</div></div>
      <div class="card"><div class="l">MOI · houses</div><div class="v">${r.moi_house&&r.moi_house.moi!=null?r.moi_house.moi.toFixed(1)+' mo':'—'}</div><div class="d">${moiTxt(r.moi_house)}</div></div>
      <div class="card"><div class="l">MOI · condo/TH</div><div class="v">${r.moi_condo&&r.moi_condo.moi!=null?r.moi_condo.moi.toFixed(1)+' mo':'—'}</div><div class="d">${moiTxt(r.moi_condo)}</div></div>
      <div class="card"><div class="l">Median DOM (sold)</div><div class="v">${r.dom_median==null?'—':(r.dom_median%1?r.dom_median.toFixed(1):r.dom_median)}</div><div class="d">${r.dom_n?r.dom_n+' closings since May 19':'Unavailable'}</div></div>
      <div class="card"><div class="l">Closings since May 19</div><div class="v">${r.sales??'—'}</div><div class="d">median sold ${money(r.sold_median)}</div></div>
    </div>
    <section><h2>Notes</h2><p>${esc(ch.text||'No character note available.')}</p>${src?'<div class="note">Sources: '+src+'</div>':''}</section>
    <section><h2>Today in this town</h2>${townNews(r)}
      ${(r.news&&r.news.length)?'<ul>'+r.news.map(n=>'<li>'+n+'</li>').join('')+'</ul>':'<div class="note">No separate news items were filed for this town in this run. Island-wide highlights are at the top of the page.</div>'}
    </section>
    <section><h2>Price vs size</h2><div id="chart-${r.id}"></div><div class="note" id="cnote-${r.id}"></div></section>
    <div class="subh" id="hh-${r.id}">Houses</div><div class="lst" id="lh-${r.id}"></div>
    <div class="subh" id="hc-${r.id}">Condo / townhomes</div><div class="lst" id="lc-${r.id}"></div>
    <div class="subh" id="ho-${r.id}">Other types</div><div class="lst" id="lo-${r.id}"></div>
    <section><h2>Recent closings in this town</h2>${rec?('<div class="note">'+rec+'</div>'):'<div class="note">No under-$2M closings in the May 19–Nov 13 window for this town.</div>'}</section>
  </section>`;
}).join('');

function rb(){
  const q=$('#q').value.toLowerCase(),ft=$('#ft').value,so=$('#so').value;
  const cmp=(a,b)=>so=='pa'?a.price-b.price:so=='pd'?b.price-a.price:so=='new'?((b.ts>0)-(a.ts>0))||b.ts-a.ts||b.price-a.price:(a.ppsf??1e9)-(b.ppsf??1e9);
  const all=B.filter(b=>{
    if(ft=='uc') return b.uc && (!q||(b.addr+' '+b.mls+' '+(b.note||'')+' '+b.type+' '+(b.broker||'')+' '+(b.area||'')+' '+(b.flood||'')).toLowerCase().includes(q));
    if(ft&&grp(b)!=ft) return false;
    return !q||(b.addr+' '+b.mls+' '+(b.note||'')+' '+b.type+' '+(b.broker||'')+' '+(b.area||'')+' '+(b.flood||'')).toLowerCase().includes(q);
  });
  REGS.forEach(r=>{
    const its=all.filter(b=>city(b)===r.id).sort(cmp);
    const h=its.filter(b=>b.type==='House');
    const c=its.filter(b=>b.type==='Condo'||b.type==='Townhome');
    const o=its.filter(b=>b.type!=='House'&&b.type!=='Condo'&&b.type!=='Townhome');
    const showH=!ft||ft==='house'||ft==='uc';
    const showC=!ft||ft==='condo'||ft==='uc';
    const showO=!ft||['mf','coop','slip','uc'].includes(ft);
    const set=(hid,lid,show,label,rows)=>{
      const hh=document.getElementById(hid), ll=document.getElementById(lid);
      hh.style.display=show?'':'none'; ll.style.display=show?'':'none';
      hh.textContent=label+' ('+rows.length+')';
      ll.innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class="note">No matching listings</div>';
    };
    set('hh-'+r.id,'lh-'+r.id,showH,'Houses',h);
    set('hc-'+r.id,'lc-'+r.id,showC,'Condo / townhomes',c);
    set('ho-'+r.id,'lo-'+r.id,showO&&(o.length||!ft||ft==='uc'||['mf','coop','slip'].includes(ft)),'Other types',o);
    renderChart(r.id, B.filter(b=>city(b)===r.id));
  });
}
['#q','#ft','#so'].forEach(s=>$(s).oninput=rb);rb();
const jl=[...document.querySelectorAll('#jump a')];
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const id=e.target.id.slice(4); jl.forEach(a=>a.classList.toggle('on',a.dataset.r===id)); }}),{rootMargin:'-40% 0px -55% 0px'});
REGS.forEach(r=>io.observe(document.getElementById('reg-'+r.id)));

$('#ll').innerHTML=(D.log||[]).map((l,i)=>{
  let extra='';
  if(l.by_town){
    extra='<div class="note">'+Object.keys(l.by_town).map(city=>{
      const d=l.by_town[city]; const bits=[];
      [['new','New'],['cuts','Cut'],['raises','Raised'],['status','Status'],['gone','Removed']].forEach(([k,lab])=>{
        (d[k]||[]).forEach(it=>bits.push(chgLine(it,k)));
      });
      return `<div><b>${esc(city)}.</b> ${bits.length?bits.join(' · '):'no changes'}</div>`;
    }).join('')+'</div>';
  }
  return `<details ${i==0?'open':''}><summary><b>${esc(l.date)}</b></summary><pre>${esc(l.text)}</pre>${extra}</details>`;
}).join('');
</script></body></html>
